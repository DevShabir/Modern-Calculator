<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ماشین حساب کامل</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="calculator">
        <!-- نمایشگر -->
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <!-- دکمه‌ها -->
        <div class="buttons" id="buttonsContainer">
            <button class="function" data-value="clear">C</button>
            <button class="function" data-value="sign">±</button>
            <button class="function" data-value="percent">%</button>
            <button class="operator" data-value="÷">÷</button>
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="×">×</button>
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="−">−</button>
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>
            <button class="span-two" data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-value="=">=</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
